{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fb">
    <title>Entrar | Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/script.js' %}" defer></script>
</head>
<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">
            <div class="brand" aria-label="Finance">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" fill="none">
                        <path d="M7 22.5 13 16l4 3.5 8-10" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M19.5 9.5H25v5.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <span>Finance<span class="brand-period">.</span></span>
            </div>

            <div class="login-heading">
                <p class="eyebrow">BEM-VINDO DE VOLTA</p>
                <h1 id="login-title">Acesse sua conta</h1>
                <p class="subtitle">Entre com seus dados para continuar.</p>
            </div>

            <form class="login-form" method="post">
                {% csrf_token %}
                <div class="field">
                    <label for="username">Nome de usuário</label>
                    <div class="input-wrap">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.7"/>
                            <path d="M5.5 20c.5-3.3 2.8-5 6.5-5s6 1.7 6.5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                        </svg>
                        <input id="username" name="username" type="text" placeholder="Digite seu usuário" autocomplete="username" required>
                    </div>
                </div>

                <div class="field">
                    <div class="label-row">
                        <label for="password">Senha</label>
                    </div>
                    <div class="input-wrap">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                            <circle cx="12" cy="15" r="1" fill="currentColor"/>
                        </svg>
                        <input id="password" name="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
                        <button class="password-toggle" id="password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false">
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                                <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.7"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button class="submit-button" type="submit">
                    <span>Entrar</span>
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                {% if error_message %}
                    <p class="form-message form-message-error" role="alert">{{ error_message }}</p>
                {% endif %}
                <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
            </form>

            <div class="security-note">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 3 19 6v5c0 4.7-2.8 8-7 10-4.2-2-7-5.3-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    <path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Seus dados estão protegidos</span>
            </div>
        </section>

        <p class="page-footer">© 2026 Finance. Feito para simplificar sua vida.</p>
    </main>
</body>
</html>
